<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mid Night Thoughts 🌙</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- Login Box -->
  <div class="login-box" id="visitorBox">
    <h2>Login / Signup 🌙</h2>
    <input type="email" id="emailInput" placeholder="Enter email">
    <input type="password" id="passwordInput" placeholder="Enter password">
    <button onclick="saveVisitor()">Continue</button>
    <p id="authError" style="color:red;"></p>
  </div>

  <!-- Chat Box -->
  <div class="chat-box" id="chatBox" style="display:none; margin-top: 30px;">
    <h2>Write Your Thoughts</h2>

    <button onclick="logout()" style="float:right;">Logout</button>

    <!-- Music -->
    
  <select id="musicSelect" onchange="playMusic()">
    <!-- Options will be populated dynamically via script.js -->
  </select>

    <audio id="player" controls style="width:100%; margin-top:10px;"></audio>

    <!-- Thought Input -->
    <textarea id="shayariInput" placeholder="Write your thoughts..."></textarea>
    <button id="saveBtn">Save</button>

    <div id="shayariList" style="margin-top:20px;"></div>
  </div>

</div>

<script type="module" src="firebase.js"></script>
<script type="module" src="script.js"></script>

</body>
</html>
